# Builds every OpenVat package, each on its own platform:
#   Linux    dist/OpenVat-<ver>-x86_64.AppImage   (Ubuntu 22.04: runs on glibc 2.35 and newer)
#   Windows  dist/OpenVat-<ver>-setup.exe         (Inno Setup 7, 64-bit installer)
#   macOS    dist/OpenVat-<ver>-arm64.dmg         (Apple Silicon)
#            dist/OpenVat-<ver>-x86_64.dmg        (Intel)
#
# Run it from the Actions tab ("Run workflow").  "Release" chooses what
# happens to the packages:
#   no       they are attached to the run as artifacts (zipped, for testing)
#   draft    also a draft GitHub release <version> - check it, then press
#            "Publish release" on the Releases page
#   publish  also a published GitHub release <version>
# <version> is openvat.__version__ (openvat/__init__.py; pyproject.toml must
# say the same) and becomes the release's tag, e.g. 0.1.2.  Running it again
# for the same version replaces the release's files.
#
# Pushing a tag works too (git tag 0.1.2 && git push origin 0.1.2, or
# v0.1.2): it must match openvat.__version__ and publishes the release.
name: Build packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release"
        type: choice
        options: ["no", "draft", "publish"]
        default: "no"
  push:
    tags: ["v[0-9]*", "[0-9]*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  INNO_VERSION: "7.0.2"
  INNO_SHA256: "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"
  QT_LIBS: >-
    libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
    libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
    libfontconfig1 libdbus-1-3

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Versions agree
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' openvat/__init__.py)
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$project" = "$version" ] || { echo "::error::pyproject.toml says $project but openvat/__init__.py says $version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME but openvat.__version__ is $version"; exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          # shellcheck disable=SC2086 # QT_LIBS is a list of packages
          sudo apt-get update && sudo apt-get install -y xvfb $QT_LIBS
      - run: python -m pip install -r requirements.txt pytest
      - run: xvfb-run -a python -m pytest -q tests

  linux:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Qt's system libraries (PyInstaller looks at them)
        run: |
          # shellcheck disable=SC2086 # QT_LIBS is a list of packages
          sudo apt-get update && sudo apt-get install -y $QT_LIBS
      - run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Inno Setup ${{ env.INNO_VERSION }}
        shell: pwsh
        run: |
          $file = "innosetup-$env:INNO_VERSION-x64.exe"
          $tag = "is-" + $env:INNO_VERSION.Replace(".", "_")
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/$file" -OutFile "$env:RUNNER_TEMP\$file"
          if ((Get-FileHash "$env:RUNNER_TEMP\$file" -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw "bad download: $file" }
          $dir = "$env:RUNNER_TEMP\inno-setup-7"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\$file" `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/PORTABLE=1", "/DIR=$dir"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install" }
          "ISCC=$dir\ISCC.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: pwsh -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-15           # Apple Silicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release != 'no')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.ref_type == 'tag' && 'publish' || inputs.release }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' openvat/__init__.py)
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=$version; fi
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist
          # a tag that already exists must be on this commit (else bump the version)
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ] && \
             [ "$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag already exists on another commit - bump openvat.__version__ (and pyproject.toml)"
              exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then           # run again: replace the files
              gh release upload "$tag" dist/* --clobber
              if [ "$MODE" = publish ]; then gh release edit "$tag" --draft=false; fi
          else
              args=(--target "$GITHUB_SHA" --title "OpenVat $version" --generate-notes)
              if [ "$MODE" = draft ]; then args+=(--draft); fi
              gh release create "$tag" dist/* "${args[@]}"
          fi
          echo "::notice::release $tag: $(gh release view "$tag" --json url -q .url)"
