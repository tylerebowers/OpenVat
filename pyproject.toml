[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvat"
version = "0.6.0"
description = "OpenVat - FOSS Resin 3D Printer Slicer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [                       # keep in step with requirements.txt
    "PySide6>=6.6",
    "PyOpenGL>=3.1",
    "numpy>=1.24",
    "trimesh>=5.0",
    "shapely>=2.0",
    "pillow>=10.0",
    "scipy>=1.15",
    "networkx>=3.0",
    "manifold3d>=3.4",
]

[project.optional-dependencies]
step = ["cadquery>=2.4"]               # STEP / IGES import (large; the app works without it)
dev = ["pytest"]

[project.scripts]
openvat = "openvat.app:main"
openvat-slice = "openvat.cli:main"

[tool.setuptools.packages.find]
include = ["openvat*"]

[tool.setuptools.package-data]
openvat = ["resources/printers/*.json", "resources/*.png"]
